name: Vibe Indexer - Quick Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Run quick index
        run: npm run index:quick

      - name: Upload indexer output
        uses: actions/upload-artifact@v4
        with:
          name: vibe-indexer-output
          path: output/
          if-no-files-found: error
          retention-days: 7
          
